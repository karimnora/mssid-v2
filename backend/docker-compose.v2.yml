name: mssid-v2
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: mssid_v2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_v2_local_only
    ports:
      - "5433:5432"
    volumes:
      - v2_postgres_data:/var/lib/postgresql/data
volumes:
  v2_postgres_data:
