# Private V2 preview environment only — never active on the V1 production service.
# Activate alongside prod: SPRING_PROFILES_ACTIVE=prod,v2 (v2 is loaded last and wins).
# The V2 database must start empty (fake accounts only), never as a copy of production.

# V2 migrations are numbered from V100 so they never collide with the ones main keeps adding
# (V16, V17…). Merging main into v2 then brings migrations numbered below the ones already
# applied here, which Flyway only accepts with out-of-order enabled.
spring.flyway.out-of-order=true

sentry.environment=v2

# Deliberately different variable names from V1: copying the production env vars onto the V2
# service must not send real emails or spend the production Gemini quota. Blank = disabled.
app.resend.api-key=${V2_RESEND_API_KEY:}
gemini.api.key=${V2_GEMINI_API_KEY:}
gemini.reels.api.key=${V2_GEMINI_REELS_API_KEY:}

# Isolated V2 data and authentication: never fall back to V1 environment variables.
server.port=${PORT:8081}
spring.datasource.url=${V2_DATABASE_URL:jdbc:postgresql://localhost:5433/mssid_v2}
spring.datasource.username=${V2_DATABASE_USERNAME:postgres}
spring.datasource.password=${V2_DATABASE_PASSWORD:postgres_v2_local_only}
app.jwt.secret=${V2_JWT_SECRET:}
app.oauth.google.client-id=${V2_GOOGLE_OAUTH_CLIENT_ID:}
app.cors.allowed-origins=${V2_CORS_ALLOWED_ORIGINS:http://localhost:3002,http://127.0.0.1:3002,https://localhost}
sentry.dsn=${V2_SENTRY_DSN:}
