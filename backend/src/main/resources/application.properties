spring.application.name=education

# Connection Base de Donnees
spring.datasource.url=jdbc:postgresql://localhost:5432/mssid_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# Configuration JPA / Hibernate — schema is now owned by Flyway (see db/migration/), Hibernate only
# validates that the entity mappings match what's actually in the database at boot.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway: V1__baseline_schema.sql captures the schema Hibernate ddl-auto=update had been maintaining
# up to Phase 20. baseline-version=1 tells Flyway "treat V1 as already applied" on any dev/prod DB
# that already has that exact schema (from ddl-auto=update) — only V2+ actually run there. A brand
# new empty database (fresh `docker compose up`) has no tables yet, so baseline-on-migrate is a no-op
# and Flyway runs V1 (and everything after) from scratch as normal.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Security & Services
# SEC: this key MUST match JwtTokenProvider's @Value binding (app.jwt.secret) — a mismatched property
# name here silently falls back to the hardcoded default in JwtTokenProvider instead of this value.
app.jwt.secret=MssidDzSecretKeyForJWTAuth2026AlgerianEducationPortal
app.jwt.expiration-ms=86400000
# SEC-06: refresh token lifetime — 30 jours par défaut (voir RefreshTokenService / AuthController).
app.jwt.refresh-expiration-ms=2592000000
gemini.api.key=AQ.Ab8RN6IY64gQgPcDaPHXMsNgt99_07o6R0fCGUD3sAugtTD3sQ

# SEC-01: HttpOnly auth cookie. app.cookie.secure MUST be true in every deployed (HTTPS) environment
# — leave it false only for plain-HTTP local dev, otherwise the browser silently drops the cookie.
app.cookie.secure=false

# SEC-08: Resend (https://resend.com) transactional email — used for the soft email-verification code
# sent at registration (see EmailVerificationService). Leave app.resend.api-key blank to disable
# sending entirely (registration still succeeds, ResendEmailService just logs a warning and skips it)
# — set it via an environment variable in every real environment, never commit a real key here.
# app.resend.from-email must be on a domain verified in the Resend dashboard before it can email
# anyone other than the account owner; the resend.dev default below only works for local testing.
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=Mssid DZ <onboarding@resend.dev>

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=INFO
logging.level.dz.mssid.education=DEBUG