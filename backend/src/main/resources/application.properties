spring.application.name=education

# Render (and most PaaS free tiers) inject the port to bind via $PORT — falls back to 8080 for
# local dev where nothing sets that env var.
server.port=${PORT:8080}

# Connection Base de Donnees — override via DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD in any
# deployed environment (e.g. a Neon connection string with ?sslmode=require). Defaults below only
# target the local docker-compose Postgres.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mssid_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Configuration JPA / Hibernate — schema is now owned by Flyway (see db/migration/), Hibernate only
# validates that the entity mappings match what's actually in the database at boot.
spring.jpa.hibernate.ddl-auto=validate

# Flyway: V1__baseline_schema.sql captures the schema Hibernate ddl-auto=update had been maintaining
# up to Phase 20. baseline-version=1 tells Flyway "treat V1 as already applied" on any dev/prod DB
# that already has that exact schema (from ddl-auto=update) — only V2+ actually run there. A brand
# new empty database (fresh `docker compose up`) has no tables yet, so baseline-on-migrate is a no-op
# and Flyway runs V1 (and everything after) from scratch as normal.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Security & Services
# SEC: this key MUST match JwtTokenProvider's @Value binding (app.jwt.secret) — a mismatched property
# name here silently falls back to the hardcoded default in JwtTokenProvider instead of this value.
# Set JWT_SECRET to ≥ 32 random bytes in every deployed environment (openssl rand -base64 32).
# The fallback below is a local-dev convenience that JwtTokenProvider refuses to boot with —
# never rely on it outside your own machine. Render generateValue strings are accepted as raw
# UTF-8 when they are long enough; a real Base64 blob of 32+ bytes still works too.
app.jwt.secret=${JWT_SECRET:MssidDzSecretKeyForJWTAuth2026AlgerianEducationPortal}
app.jwt.expiration-ms=86400000
# SEC-06: refresh token lifetime — 30 jours par défaut (voir RefreshTokenService / AuthController).
app.jwt.refresh-expiration-ms=2592000000
# Set via GEMINI_API_KEY env var — never hardcode a real key here (this file is committed to git).
gemini.api.key=${GEMINI_API_KEY:}

# SEC-01: HttpOnly auth cookie. app.cookie.secure MUST be true in every deployed (HTTPS) environment
# — leave it false only for plain-HTTP local dev, otherwise the browser silently drops the cookie.
app.cookie.secure=${COOKIE_SECURE:false}
# "Strict" only works when frontend and backend share a domain. Set COOKIE_SAME_SITE=None (and
# COOKIE_SECURE=true, mandatory alongside None) when they're on different domains, e.g. a Vercel
# frontend calling a Render backend — otherwise the browser never sends the auth cookie cross-site.
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# SEC-08: Resend (https://resend.com) transactional email — used for the soft email-verification code
# sent at registration (see EmailVerificationService). Leave app.resend.api-key blank to disable
# sending entirely (registration still succeeds, ResendEmailService just logs a warning and skips it)
# — set it via an environment variable in every real environment, never commit a real key here.
# mssid-dz.com is verified in the Resend dashboard (SPF/DKIM via Cloudflare auto-configure) — real
# users now actually receive their verification email instead of it silently only reaching the
# Resend account owner via the onboarding@resend.dev sandbox sender.
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=Mssid DZ <noreply@mssid-dz.com>
# Free-tier caps used by GET /api/v1/admin/infra/quotas (Technical Logs CRM). Override only if you
# upgrade the Resend plan — the dashboard numbers would otherwise show a stale 100/3000 ceiling.
app.resend.daily-limit=${RESEND_DAILY_LIMIT:100}
app.resend.monthly-limit=${RESEND_MONTHLY_LIMIT:3000}

# Neon API (optional) — Admin Console quotas. Create a key at https://console.neon.tech → Account
# settings → API keys. Project id is the slug in the project URL (e.g. orange-mode-xxxxxx).
app.neon.api-key=${NEON_API_KEY:}
app.neon.project-id=${NEON_PROJECT_ID:}
app.neon.org-id=${NEON_ORG_ID:}
app.neon.compute-cu-hours-limit=${NEON_COMPUTE_CU_HOURS_LIMIT:100}
app.neon.storage-bytes-limit=${NEON_STORAGE_BYTES_LIMIT:536870912}

# Render API (optional) — same CRM tab. Key from https://dashboard.render.com/u/settings?add-api-key.
# Service id is the srv-… in the service URL; if omitted we look up RENDER_SERVICE_NAME instead.
# Remaining free instance-hours (750/mois) are NOT in Render's public API — the CRM shows live
# CPU/RAM + a Billing link for that meter.
app.render.api-key=${RENDER_API_KEY:}
app.render.service-id=${RENDER_SERVICE_ID:}
app.render.service-name=${RENDER_SERVICE_NAME:mssid-backend}

# Daily Gemini call quota per role (AiQuotaService). The Gemini API key currently in use is on
# Google's free tier, which caps total project-wide usage (not just per-user) far below what these
# per-user limits alone would suggest — lower AI_QUOTA_FREE here if the project-wide cap starts
# getting hit as the user base grows, without a code change, just a Render env var update + redeploy.
ai.quota.free=${AI_QUOTA_FREE:3}
ai.quota.premium=${AI_QUOTA_PREMIUM:50}
ai.quota.admin=${AI_QUOTA_ADMIN:1000}

# SEC: comma-separated list of allowed frontend origins for CORS. The previous config used a "*"
# wildcard pattern combined with allowCredentials(true) — any third-party site could replay an
# authenticated request using a logged-in child's session cookie. Set CORS_ALLOWED_ORIGINS to the
# real frontend URL(s) in every deployed environment (e.g. https://mssid-dz.com,https://www.mssid-dz.com).
# MUST also include https://localhost — with capacitor.config.json's androidScheme:"https", that is
# the origin the native Android/Capacitor app's WebView presents on every API call (remonte
# utilisateur : le site web fonctionnait mais l'app native recevait systematiquement "Impossible de
# contacter le serveur" — confirme en direct par un preflight OPTIONS renvoyant 403 pour cette origine).
# Production origins are set in render.yaml (CORS_ALLOWED_ORIGINS). Add any extra Vercel alias in the
# Render dashboard — Spring setAllowedOrigins does not accept *.vercel.app wildcards.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Prix unique de l'abonnement annuel ROLE_PREMIUM — source de vérité côté serveur (voir
# PaymentServiceImpl.submitReceipt) ; le frontend l'affiche depuis la même valeur
# (frontend/src/constants/pricing.ts), les deux doivent rester synchronisés manuellement.
app.payments.subscription-price-dzd=1500

# Logging — quiet by default so a forgotten profile cannot dump SQL / Security DEBUG in production.
# Local verbose logs: SPRING_PROFILES_ACTIVE=dev (see application-dev.properties).
# Render sets SPRING_PROFILES_ACTIVE=prod (see application-prod.properties).
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.org.springframework=INFO
logging.level.dz.mssid.education=${LOGGING_LEVEL_APP:INFO}