spring.application.name=education

# Render (and most PaaS free tiers) inject the port to bind via $PORT — falls back to 8080 for
# local dev where nothing sets that env var.
server.port=${PORT:8080}

# Connection Base de Donnees — override via DATABASE_URL/DATABASE_USERNAME/DATABASE_PASSWORD in any
# deployed environment (e.g. a Neon connection string with ?sslmode=require). Defaults below only
# target the local docker-compose Postgres.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mssid_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Configuration JPA / Hibernate — schema is now owned by Flyway (see db/migration/), Hibernate only
# validates that the entity mappings match what's actually in the database at boot.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway: V1__baseline_schema.sql captures the schema Hibernate ddl-auto=update had been maintaining
# up to Phase 20. baseline-version=1 tells Flyway "treat V1 as already applied" on any dev/prod DB
# that already has that exact schema (from ddl-auto=update) — only V2+ actually run there. A brand
# new empty database (fresh `docker compose up`) has no tables yet, so baseline-on-migrate is a no-op
# and Flyway runs V1 (and everything after) from scratch as normal.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Security & Services
# SEC: this key MUST match JwtTokenProvider's @Value binding (app.jwt.secret) — a mismatched property
# name here silently falls back to the hardcoded default in JwtTokenProvider instead of this value.
# Set JWT_SECRET to a long random value in every deployed environment — the fallback below is a local
# dev convenience only, never rely on it outside your own machine.
app.jwt.secret=${JWT_SECRET:MssidDzSecretKeyForJWTAuth2026AlgerianEducationPortal}
app.jwt.expiration-ms=86400000
# SEC-06: refresh token lifetime — 30 jours par défaut (voir RefreshTokenService / AuthController).
app.jwt.refresh-expiration-ms=2592000000
# Set via GEMINI_API_KEY env var — never hardcode a real key here (this file is committed to git).
gemini.api.key=${GEMINI_API_KEY:}

# SEC-01: HttpOnly auth cookie. app.cookie.secure MUST be true in every deployed (HTTPS) environment
# — leave it false only for plain-HTTP local dev, otherwise the browser silently drops the cookie.
app.cookie.secure=${COOKIE_SECURE:false}
# "Strict" only works when frontend and backend share a domain. Set COOKIE_SAME_SITE=None (and
# COOKIE_SECURE=true, mandatory alongside None) when they're on different domains, e.g. a Vercel
# frontend calling a Render backend — otherwise the browser never sends the auth cookie cross-site.
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# SEC-08: Resend (https://resend.com) transactional email — used for the soft email-verification code
# sent at registration (see EmailVerificationService). Leave app.resend.api-key blank to disable
# sending entirely (registration still succeeds, ResendEmailService just logs a warning and skips it)
# — set it via an environment variable in every real environment, never commit a real key here.
# app.resend.from-email must be on a domain verified in the Resend dashboard before it can email
# anyone other than the account owner; the resend.dev default below only works for local testing.
app.resend.api-key=${RESEND_API_KEY:}
app.resend.from-email=Mssid DZ <onboarding@resend.dev>

# SEC: comma-separated list of allowed frontend origins for CORS. The previous config used a "*"
# wildcard pattern combined with allowCredentials(true) — any third-party site could replay an
# authenticated request using a logged-in child's session cookie. Set CORS_ALLOWED_ORIGINS to the
# real frontend URL(s) in every deployed environment (e.g. https://mssid.dz,https://www.mssid.dz).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Prix unique de l'abonnement annuel ROLE_PREMIUM — source de vérité côté serveur (voir
# PaymentServiceImpl.submitReceipt) ; le frontend l'affiche depuis la même valeur
# (frontend/src/constants/pricing.ts), les deux doivent rester synchronisés manuellement.
app.payments.subscription-price-dzd=1500

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework=INFO
logging.level.dz.mssid.education=DEBUG