# Loaded when SPRING_PROFILES_ACTIVE=prod (see render.yaml). Safe defaults even if someone
# forgets to override the shared application.properties logging keys.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springframework.security=INFO
logging.level.dz.mssid.education=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Render Starter (512MB RAM / 0.5 CPU) can't usefully serve Tomcat's default max of 200 threads —
# with only half a CPU to schedule them on, more threads than this just add context-switch and
# per-thread stack overhead without any real throughput gain. Revisit (raise) if the Render plan
# is ever upgraded to more CPU.
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=5

# Neon can suspend after inactivity only if the application stops probing it.
# Release idle connections after about 60-90 seconds; do not keep or ping a warm pool.
# Flyway and Hibernate schema validation still require a working database at startup.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.keepalive-time=0
