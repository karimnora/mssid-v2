name: Android V2 Beta Build
on:
  workflow_dispatch: {}
jobs:
  beta:
    if: github.ref == 'refs/heads/v2'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build and sync test assets
        env:
          VITE_V2_SPRING_BOOT_URL: ${{ vars.VITE_V2_SPRING_BOOT_URL || secrets.VITE_V2_SPRING_BOOT_URL }}
          VITE_V2_GOOGLE_CLIENT_ID: ${{ vars.VITE_V2_GOOGLE_CLIENT_ID }}
        run: npm run cap:sync:beta
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build debug-signed beta APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleBeta
      - uses: actions/upload-artifact@v4
        with:
          name: mssid-v2-beta-apk
          path: frontend/android/app/build/outputs/apk/beta/app-beta.apk
