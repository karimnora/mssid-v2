<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body><div id="root"></div>
<script type="module">
  import React from 'react';
  import { createRoot } from 'react-dom/client';
  import { LocaleProvider } from '/src/context/LocaleContext.tsx';
  import '/src/index.css';
  const query = new URLSearchParams(location.search);
  const kind = query.get('view');
  const noop = () => {};
  const props = { onClose: noop, onExit: noop, onBack: noop };
  let Component;
  if (kind === 'preschool') {
    ({ PreschoolPrintablesModal: Component } = await import('/src/components/preschool/PreschoolPrintablesModal.tsx'));
    props.language = query.get('lang') || 'fr';
  } else if (kind === 'worksheet') {
    ({ PrintableWorksheetsGeneratorModal: Component } = await import('/src/components/PrintableWorksheetsGeneratorModal.tsx'));
    Object.assign(props, { isOpen: true, defaultGrade: '5AP' });
  } else if (kind === 'certificate') {
    ({ HonorCertificatesStudioModal: Component } = await import('/src/components/HonorCertificatesStudioModal.tsx'));
    Object.assign(props, { isOpen: true, defaultGrade: '5AP' });
    if (query.get('allDiplomas') === 'true') {
      props.userProfile = { name: 'Élève Test', badges: ['diploma_1ap', 'diploma_2ap', 'diploma_3ap', 'diploma_4ap', 'diploma_5ap'] };
    }
  } else if (kind === 'wilayas') {
    ({ WilayasExplorer: Component } = await import('/src/components/WilayasExplorer.tsx'));
  } else if (kind === 'writing') {
    ({ TouchWritingStudio: Component } = await import('/src/components/TouchWritingStudio.tsx'));
    props.grade = '5AP';
  } else if (kind === 'tamazight') {
    ({ TamazightCurriculumViewer: Component } = await import('/src/components/TamazightCurriculumViewer.tsx'));
    props.grade = query.get('grade') || '4AP';
  } else if (kind === 'revision') {
    ({ RevisionSheetViewer: Component } = await import('/src/components/RevisionSheetViewer.tsx'));
    const { ARABIC_1AP_THEMES } = await import('/src/data/courses/1AP/arabic-themes.ts');
    props.lesson = ARABIC_1AP_THEMES[0];
  }
  window.print = () => {
    window.__printSnapshot = document.body.innerHTML;
    window.__printCalls = (window.__printCalls || 0) + 1;
  };
  createRoot(document.getElementById('root')).render(
    React.createElement(LocaleProvider, null, React.createElement(Component, props))
  );
</script>
</body></html>
