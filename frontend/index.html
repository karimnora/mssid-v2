    <!--
      SEC-02: strict CSP. Notes on the deliberate looseness:
      - style-src allows 'unsafe-inline' because the app relies heavily on React inline `style={{}}`
        props; removing it would blank out large parts of the UI without a nonce-based styling pass.
      - connect-src allows `https:` broadly since the Spring Boot backend URL is env-configured
        (VITE_SPRING_BOOT_URL) and not known at the time this static file is written; localhost
        entries cover local dev against `mvnw spring-boot:run` (8080) and the Express proxy (3000).
      - Fonts are self-hosted (@fontsource Cairo + Readex Pro). font-src 'self' is enough.
      - frame-ancestors/report-uri are NOT enforced here — browsers ignore those directives when set
        via <meta>, they only work as a real HTTP response header (e.g. from server.ts).
      - In `npm run dev`, @vitejs/plugin-react's Fast Refresh preamble is an inline <script> — if it
        gets blocked, that only affects hot-reload in development, never the production build.
      - script-src/connect-src/frame-src allow accounts.google.com for Google Identity Services (the
        "Continuer avec Google" button, see AuthModal.tsx): the library's own <script> tag, its
        internal fetch calls, and the button/One Tap iframe it renders all come from that origin.
      - script-src allows va.vercel-scripts.com for @vercel/analytics (an actual dependency, see
        package.json) — without it the analytics script load is silently blocked, so Vercel Analytics
        collects nothing in production despite being installed and wired up.
      - worker-src 'self' blob: covers canvas-confetti's default worker-mode rendering (BadgeUnlockToast
        and friends): with no worker-src directive it falls back to script-src, which has no `blob:`,
        so every badge-unlock celebration tried and failed to spin up its render worker. It still
        rendered (the library catches the failure and falls back to main-thread canvas), just noisily.
      - script-src allows 'wasm-unsafe-eval' for @ffmpeg/ffmpeg (Reels Studio's client-side MP4 export,
        see utils/reelVideoExport.ts): compiling WebAssembly requires it under CSP3 even though the
        library itself is dynamically imported only when an admin clicks "Télécharger (vidéo)" — every
        other visitor never loads that code path at all.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://accounts.google.com https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:8080 http://localhost:3000; frame-src https://accounts.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" />
