<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      SEC-02: strict CSP. Notes on the deliberate looseness:
      - style-src allows 'unsafe-inline' because the app relies heavily on React inline `style={{}}`
        props; removing it would blank out large parts of the UI without a nonce-based styling pass.
      - connect-src allows `https:` broadly since the Spring Boot backend URL is env-configured
        (VITE_SPRING_BOOT_URL) and not known at the time this static file is written; localhost
        entries cover local dev against `mvnw spring-boot:run` (8080) and the Express proxy (3000).
      - Fonts are self-hosted (@fontsource Cairo + Readex Pro). font-src 'self' is enough.
      - frame-ancestors/report-uri are NOT enforced here — browsers ignore those directives when set
        via <meta>, they only work as a real HTTP response header (e.g. from server.ts).
      - In `npm run dev`, @vitejs/plugin-react's Fast Refresh preamble is an inline <script> — if it
        gets blocked, that only affects hot-reload in development, never the production build.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:8080 http://localhost:3000; object-src 'none'; base-uri 'self'; form-action 'self';" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#008751" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مَسيد DZ" />
    <!-- R2.3: manifest link is now injected automatically by vite-plugin-pwa (see vite.config.ts's
         VitePWA({ manifest: {...} }) — no more static /manifest.json reference needed here. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/pwa-icon-source.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>مَسيد DZ - منصة التعليم الابتدائي الجزائري</title>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
