# Render Blueprint — connect this repo on Render ("New +" -> "Blueprint") and it reads this file
# to provision the backend web service. Values marked `sync: false` are secrets Render will prompt
# for manually instead of storing in this (committed) file.
services:
  - type: web
    name: mssid-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon (or any managed Postgres) connection info — see backend/src/main/resources/application.properties.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # Long random string (≥ 32 chars). To pin a Base64 key instead: openssl rand -base64 32
      # then paste it in the Render dashboard (do not commit it).
      - key: JWT_SECRET
        generateValue: true
      # HTTPS on Render is automatic; both must be set for a cross-domain frontend (e.g. Vercel) to
      # actually receive the auth cookie — see AuthController's cookieSecure/cookieSameSite fields.
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: None
      # Credentialed CORS — application.properties defaults to localhost only. Capacitor's WebView
      # origin is https://localhost (androidScheme: https). Add extra Vercel aliases in the dashboard
      # (Spring setAllowedOrigins does not accept *.vercel.app wildcards).
      - key: CORS_ALLOWED_ORIGINS
        value: https://mssid-dz.com,https://www.mssid-dz.com,https://localhost
      - key: RESEND_API_KEY
        sync: false
      # Optional — Sentry error tracking (Phase 190). Free project at sentry.io, paste its DSN
      # here. Blank/unset = the SDK stays fully no-op, nothing else changes.
      - key: SENTRY_DSN
        sync: false
      # Optional — Admin Console "quotas infra" (Technical Logs). Without these the CRM cards show
      # "not configured" instead of live numbers; the app itself keeps working.
      - key: NEON_API_KEY
        sync: false
      - key: NEON_PROJECT_ID
        sync: false
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Independent key for the admin-only Reels Studio ad/reel generator — deliberately separate
      # from GEMINI_API_KEY above so it can never eat into the student AI Tutor's quota. Blank =
      # the "استوديو الإعلانات" admin tab returns a clear "not configured" error, nothing else breaks.
      - key: GEMINI_REELS_API_KEY
        sync: false
      # Google Sign-In OAuth Client ID (public value, not a secret) — must match the frontend's
      # VITE_GOOGLE_CLIENT_ID exactly. Blank/unset = /api/v1/auth/google answers 503, nothing else
      # changes. See backend/.env.example.
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # Daily Gemini call quota per role (AiQuotaService) — lower AI_QUOTA_FREE here (no code
      # change) if usage approaches the free-tier Gemini key's project-wide daily cap.
      - key: AI_QUOTA_FREE
        value: 3
      - key: AI_QUOTA_PREMIUM
        value: 50
      - key: AI_QUOTA_ADMIN
        value: 1000
