# Import as a NEW service, never apply to mssid-backend (V1).
services:
  - type: web
    name: mssid-backend-v2
    branch: v2
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeployTrigger: 'off'
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,v2
      - key: V2_DATABASE_URL
        sync: false
      - key: V2_DATABASE_USERNAME
        sync: false
      - key: V2_DATABASE_PASSWORD
        sync: false
      - key: V2_JWT_SECRET
        generateValue: true
      - key: V2_CORS_ALLOWED_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: true
      - key: COOKIE_SAME_SITE
        value: None
